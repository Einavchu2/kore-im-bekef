<!DOCTYPE html>
<html lang="he" dir="rtl" data-build="prod">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קוראים בכיף! תרגול קריאה לכיתה א׳</title>
<meta name="description" content="קוראים בכיף: תרגול קריאה בניקוד לכיתה א׳, בהתאמה לרמת הילד/ה.">
<meta name="theme-color" content="#7B5CF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קוראים בכיף">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/noto-sans-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/secular-one.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Noto Sans Hebrew';src:url(fonts/noto-sans-hebrew.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Secular One';src:url(fonts/secular-one.woff2) format('woff2');font-weight:400;font-display:swap}
</style>
<style>
:root{
  --paper:#EEF5FF; --rule:#D3E3FA; --surface:#FFFFFF; --ink:#23305A; --muted:#5D6A92;
  --tile:#FFFFFF; --slot:#E2ECFB; --line:#C9D7EE;
  --orange:#FF8A2B; --blue:#2F7BF6; --green:#22B26B; --yellow:#FFC21A; --red:#F0476A; --purple:#7B5CF0;
  --press:rgba(35,48,90,.22);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161C33; --rule:#222B4A; --surface:#232C4D; --ink:#EEF2FF; --muted:#AEB8DA;
    --tile:#2C3760; --slot:#1D2542; --line:#3B4774; --press:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161C33; --rule:#222B4A; --surface:#232C4D; --ink:#EEF2FF; --muted:#AEB8DA;
  --tile:#2C3760; --slot:#1D2542; --line:#3B4774; --press:rgba(0,0,0,.45);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:'Secular One','Noto Sans Hebrew',Arial,sans-serif;
  background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 37px,var(--rule) 37px 39px);
}
.heb{font-family:'Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--purple);outline-offset:3px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;max-width:920px;margin:0 auto;padding:12px 14px 4px}
.buddy{font-size:54px;line-height:1;filter:drop-shadow(0 4px 0 var(--press));animation:bob 3s ease-in-out infinite;cursor:pointer;user-select:none}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
.bubble{flex:1;position:relative;background:var(--surface);border:3px solid var(--ink);border-radius:22px;padding:10px 16px;font-size:clamp(17px,4.4vw,22px);line-height:1.35;min-height:52px;display:flex;align-items:center}
.bubble::before{content:"";position:absolute;right:-13px;top:18px;border:10px solid transparent;border-left-color:var(--ink)}
.bubble::after{content:"";position:absolute;right:-8px;top:20px;border:8px solid transparent;border-left-color:var(--surface)}
.tools{display:flex;flex-direction:column;align-items:center;gap:6px}
.stars{background:var(--yellow);color:#3A2A00;border-radius:16px;padding:4px 10px;font-size:18px;white-space:nowrap;box-shadow:0 3px 0 var(--press)}
.iconbtns{display:flex;gap:6px}
.ib{background:var(--surface);border:2px solid var(--line);border-radius:12px;width:38px;height:38px;font-size:18px;cursor:pointer;display:grid;place-items:center}

main{max-width:920px;margin:0 auto;padding:10px 14px 48px}
h1{font-size:clamp(34px,9vw,58px);margin:10px 0 4px;text-align:center;line-height:1.1}
h2{font-size:clamp(24px,6vw,34px);margin:8px 0;text-align:center}
.center{text-align:center}
.muted{color:var(--muted)}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:center}

.btn{border:none;border-radius:20px;padding:14px 28px;font-size:clamp(20px,5vw,26px);background:var(--purple);color:#fff;cursor:pointer;box-shadow:0 7px 0 var(--press);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--press)}
.btn.big{font-size:clamp(26px,7vw,36px);padding:18px 44px;border-radius:28px}
.btn.ghostb{background:var(--surface);color:var(--ink);border:3px solid var(--line)}
.btn.green{background:var(--green)}
.btn.small{font-size:18px;padding:10px 18px;border-radius:14px}

/* syllable cards — the hero of the app */
.card{
  font-family:'Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif;font-weight:800;
  font-size:clamp(46px,12vw,76px);line-height:1.55;
  background:var(--tile);color:var(--ink);border:4px solid var(--ink);border-radius:20px;
  min-width:92px;min-height:118px;padding:0 14px;
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 6px 0 var(--press);cursor:pointer;user-select:none;
  transition:transform .12s;
}
.card:nth-child(3n+1){transform:rotate(-1.5deg)}
.card:nth-child(3n+2){transform:rotate(1.2deg)}
.card.sel{background:var(--yellow);color:#2B2100;transform:scale(1.06) rotate(0)}
.card.target{border-color:var(--blue);background:var(--blue);color:#fff;transform:rotate(-2deg);cursor:default}
.card.ok{border-color:var(--green)!important;background:#C9F5DD!important;color:#0E3B23!important}
.card.bad{border-color:var(--red)!important;background:#FFD3DD!important;color:#4A0716!important}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}
@media (max-width:540px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{min-width:0}}

.prompt{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.prompt .txt{font-size:clamp(20px,5.2vw,28px);text-align:center}
.hear{background:var(--blue);color:#fff;border:none;border-radius:50%;width:64px;height:64px;font-size:30px;cursor:pointer;box-shadow:0 6px 0 var(--press)}
.hear.huge{width:120px;height:120px;font-size:58px}
.pic{font-size:clamp(84px,22vw,130px);line-height:1;text-align:center;filter:drop-shadow(0 6px 0 var(--press))}

/* building words */
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.slot{min-width:92px;min-height:118px;border:4px dashed var(--muted);border-radius:20px;background:var(--slot);display:flex;align-items:center;justify-content:center}
.slot.over,.bin.over{border-color:var(--purple);background:#E5DDFF}
.tray{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;min-height:124px;padding:12px;border-radius:24px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.tile,.picTile{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile.used{visibility:hidden}
.slot .card{transform:none;box-shadow:none;border-width:3px}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%) scale(1.1) rotate(-4deg)!important}
.lifting{opacity:.35}

/* sorting bins */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.bin{border:4px dashed var(--ink);border-radius:26px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--surface)}
.bin .heb{font-size:clamp(48px,12vw,72px);line-height:1.4}
.bin.b{border-color:var(--blue)}
.bin.a{border-color:var(--red)}
.picTile{display:inline-flex;flex-direction:column;align-items:center;background:var(--surface);border:4px solid var(--ink);border-radius:24px;padding:10px 22px;box-shadow:0 6px 0 var(--press);cursor:grab;user-select:none;touch-action:none}
.picTile .pic{font-size:88px;filter:none}
.picTile .heb{font-size:34px;line-height:1.6}
.sorttray .picTile{padding:6px 14px}.sorttray .picTile .pic{font-size:60px}.sorttray .picTile .heb{font-size:26px}
.picTile.sel{border-color:var(--purple);background:#E9E2FF;color:#23305A}
.bin .got{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:40px;min-height:44px}

.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.opt{background:var(--surface);border:4px solid var(--ink);border-radius:22px;padding:8px 20px;cursor:pointer;box-shadow:0 6px 0 var(--press);min-width:110px;text-align:center}
.opt .heb{font-size:clamp(40px,10vw,60px);line-height:1.6;display:block}
.opt .lbl{font-size:20px}
.opt.picopt{font-size:clamp(64px,17vw,96px);line-height:1.2;padding:12px 18px}
.circles{display:flex;gap:12px;justify-content:center;margin:10px 0}
.circle{width:clamp(86px,22vw,116px);height:clamp(86px,22vw,116px);border-radius:50%;border:4px solid var(--ink);background:var(--surface);display:grid;place-items:center;font-size:clamp(40px,10vw,58px)}

.progress{display:flex;gap:6px;justify-content:center;margin:2px 0 10px}
.progress i{width:18px;height:18px;border-radius:50%;background:var(--line)}
.progress i.done{background:var(--green)}
.progress i.now{background:var(--yellow);transform:scale(1.25)}

/* onboarding */
.input{font:inherit;font-size:32px;text-align:center;padding:14px;border-radius:20px;border:4px solid var(--ink);width:min(420px,90%);background:var(--surface);color:var(--ink)}
.avatars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0}
@media (max-width:540px){.avatars{grid-template-columns:repeat(3,minmax(0,1fr))}}
.av{background:var(--surface);border:4px solid var(--line);border-radius:24px;padding:10px 4px;cursor:pointer;text-align:center}
.av .e{font-size:56px;display:block;line-height:1.2}
.av .n{font-size:18px}
.av.sel{border-color:var(--purple);background:#E9E2FF;color:#23305A}
.profiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:20px 0}
.prof{background:var(--surface);border:4px solid var(--ink);border-radius:24px;padding:12px 20px;cursor:pointer;min-width:130px;text-align:center;box-shadow:0 6px 0 var(--press)}
.prof .e{font-size:54px;display:block}
.prof .n{font-size:22px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-inline-start:6px}

/* home */
.badge{display:flex;align-items:center;gap:16px;background:var(--surface);border:4px solid var(--ink);border-radius:28px;padding:16px 20px;margin:12px auto;max-width:560px}
.badge .bigdot{width:64px;height:64px;border-radius:50%;flex:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.bar{height:20px;background:var(--slot);border-radius:12px;overflow:hidden;margin-top:6px;border:2px solid var(--line)}
.bar>div{height:100%;background:var(--green);border-radius:10px;transition:width .6s}
.stickers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:38px;margin-top:8px}
.stickers .lock{opacity:.25;filter:grayscale(1)}

.shake{animation:shake .45s}
@keyframes shake{20%,60%{translate:-9px 0}40%,80%{translate:9px 0}}
.pop{animation:pop .5s}
@keyframes pop{40%{scale:1.15}}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti span{position:absolute;top:-50px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* teacher panel */
.panel{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:16px;font-family:'Noto Sans Hebrew',Arial,sans-serif;font-weight:600}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
select{font:inherit;padding:4px;border-radius:8px}
.legend p{margin:6px 0;line-height:1.5;font-size:15px}

.path{display:flex;flex-direction:column;align-items:center;gap:16px;margin:18px 0;position:relative}
.path::before{content:"";position:absolute;top:24px;bottom:24px;left:50%;border-left:6px dashed var(--line)}
.stop{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border:4px solid var(--ink);border-radius:999px;padding:8px 14px;width:min(360px,84%);cursor:pointer;box-shadow:0 6px 0 var(--press);font-size:clamp(18px,4.8vw,22px);text-align:right}
.stop:nth-child(4n+2){translate:-6% 0}.stop:nth-child(4n){translate:6% 0}
.stop .ic{font-size:34px;width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--slot)}
.stop .nm{flex:1}
.stop.done{border-color:var(--green)}.stop.done .ic{background:#C9F5DD}
.stop.open .ic{background:var(--yellow)}
.stop.locked{color:var(--muted);border-color:var(--line);cursor:default;box-shadow:none}
.readbox{background:var(--surface);border:4px solid var(--ink);border-radius:26px;padding:14px 20px;margin:12px auto;max-width:760px;text-align:center;font-family:'Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif;font-weight:800;line-height:1.9}
.readbox.words{font-size:clamp(56px,15vw,96px)}.readbox.phrases{font-size:clamp(44px,11vw,72px)}.readbox.short{font-size:clamp(36px,9vw,58px)}.readbox.long,.readbox.page{font-size:clamp(28px,7vw,46px)}
.rw{display:inline-block;padding:0 .12em;border-radius:12px;cursor:pointer;transition:background .15s}
.rw.hl{background:var(--yellow);color:#2B2100}
.rw.hit{color:var(--green)}.rw.miss{color:var(--orange)}
.sy.s0{color:var(--red)}.sy.s1{color:var(--blue)}.sydot{color:var(--muted);font-weight:600;margin:0 .04em}
.small .card{font-size:clamp(26px,6.5vw,40px);min-height:80px;min-width:0;padding:0 12px}
.small .slot{min-width:68px;min-height:84px}
.card.sent{font-size:clamp(28px,7vw,44px);padding:6px 20px;line-height:1.9;max-width:100%;flex-wrap:wrap;transform:none}
.blank{display:inline-block;min-width:2.4em;border-bottom:5px solid currentColor;margin:0 .1em}
.bookcover{text-align:center;background:var(--surface);border:4px solid var(--ink);border-radius:16px 34px 34px 16px;padding:22px;max-width:460px;margin:16px auto;box-shadow:-10px 8px 0 var(--purple)}
.pageno{text-align:center;color:var(--muted);font-size:18px}
@media (max-width:540px){
  .top{flex-wrap:wrap;gap:8px}
  .tools{order:-1;width:100%;flex-direction:row;justify-content:space-between}
  .buddy{font-size:44px}
  .slots:not(.small .slots){flex-wrap:nowrap;gap:6px}
  .slot{min-width:0;width:clamp(54px,17vw,92px);min-height:100px}
  .slot .card,.tray .card{min-width:clamp(54px,17vw,92px);min-height:100px;font-size:clamp(36px,10vw,56px);padding:0 6px}
  .small .slot{width:auto;min-width:56px;min-height:76px}
  .small .slot .card,.small .tray .card{font-size:clamp(24px,6.8vw,34px);min-height:70px;min-width:0;padding:0 10px}
}
.card.locked{background:var(--slot);cursor:default}
@media (prefers-reduced-motion: reduce){
  .buddy{animation:none}.confetti{display:none}.shake,.pop{animation:none}
}
</style>
</head>
<body>
<noscript><p style="font-size:22px;text-align:center;padding:30px">כדי לשחק צריך להפעיל JavaScript בדפדפן.</p></noscript>
<div class="top">
  <div class="buddy" id="buddy" title="לשמוע שוב" role="button" aria-label="לשמוע שוב">🦉</div>
  <div class="bubble" id="bubble" aria-live="polite">שלום!</div>
  <div class="tools">
    <div class="stars" id="stars">⭐ 0</div>
    <div class="iconbtns">
      <button class="ib" id="soundBtn" aria-label="קול">🔊</button>
      <button class="ib" id="homeBtn" aria-label="בית">🏠</button>
      <button class="ib" id="teachBtn" aria-label="מבוגרים">⚙️</button>
    </div>
  </div>
</div>
<main id="stage"></main>

<script>
/* ===================== Hebrew helpers ===================== */
const MARK={a:'\u05B8',p:'\u05B7',e:'\u05B0','.':'\u05BC',s:'\u05C1',i:'\u05B4',o:'\u05B9',E:'\u05B5',H:'\u05B2',S:'\u05C2'};
const H=s=>[...s.replace(/\.(?=\s|$)/g,'\u0000')].map(c=>c==='\u0000'?'.':(MARK[c]??c)).join('');
const KAM='\u05B8',PAT='\u05B7',SHVA='\u05B0',SEGOL='\u05B6';
const strip=s=>s.replace(/[\u0591-\u05C7]/g,'');
function vowelOf(u){if(u.includes(KAM)||u.includes(PAT))return 'a';if(u.includes(SHVA))return 'e';return 'n';}
const LET='אבגדהוזחטיכלמנסעפצקרשת'.split('');
function baseLetter(l){if('בכפ'.includes(l))return l+'\u05BC';if(l==='ש')return l+'\u05C1';return l;}
const VOW={k:KAM,p:PAT,e:SHVA,n:''};
const syl=(l,v)=>baseLetter(l)+VOW[v];
const NAMES={'א':'אלף','ב':'בית','ג':'גימל','ד':'דלת','ה':'הא','ו':'וו','ז':'זין','ח':'חית','ט':'טית','י':'יוד','כ':'כף','ל':'למד','מ':'מם','נ':'נון','ס':'סמך','ע':'עין','פ':'פא','צ':'צדי','ק':'קוף','ר':'ריש','ש':'שין','ת':'תו','ם':'מם סופית','ן':'נון סופית','ף':'פא סופית','ך':'כף סופית','ץ':'צדי סופית'};
const VNAME={k:{g:'\u25CC'+KAM,n:H('קaמaץ')},p:{g:'\u25CC'+PAT,n:H('פ.pתaח')},e:{g:'\u25CC'+SHVA,n:H('שseוaא')},n:{g:'\u25CC',n:H('ב.eלiי נiק.ו.ד')}};
// spoken form of a single syllable
function sylSound(u){
  if(strip(u).length>=2)return u;
  const v=vowelOf(u);
  if(v==='a')return /ה$/.test(u)?u:u+'ה';
  if(v==='e')return u.replace(SHVA,SEGOL)+'ה';
  const s=strip(u);return s.length===1?(NAMES[s]||s):u;
}
// merge closed syllables: a shva (not word-initial) or bare letter joins the syllable before it
function chunks(units){const out=[];units.forEach((u,i)=>{const v=vowelOf(u);if(i>0&&(v==='n'||v==='e'))out[out.length-1]+=u;else out.push(u);});return out;}

/* ===================== Word bank ===================== */
const W=(code,pic)=>({units:code.split('|').map(H),word:H(code.replace(/\|/g,'')),pic});

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const shuffle=(r,a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function scramble(r,arr,answer){let s=shuffle(r,arr);for(let i=0;i<8&&s.slice(0,answer.length).join('|')===answer.join('|');i++)s=shuffle(r,arr);return s;}
function distractor(r,avoid){for(let i=0;i<30;i++){const d=syl(pick(r,LET),pick(r,['k','p','e']));if(!avoid.includes(d))return d;}return syl('ל','k');}
function variant(w,r){
  const u=w.units;
  for(let t=0;t<12;t++){
    const idx=Math.floor(r()*u.length),s=u[idx],v=vowelOf(s);let ns=null;
    if(r()<.5&&(v==='a'||v==='e'))ns=v==='a'?s.replace(/[\u05B7\u05B8]/,SHVA):s.replace(SHVA,KAM);
    else if(idx<u.length-1){const L=s[0];const nl=pick(r,LET.filter(x=>x!==L&&x!=='ו'&&x!=='ה'));ns=baseLetter(nl)+s.slice(1).replace(/^[\u05BC\u05C1]+/,'');}
    if(ns&&ns!==s){const c=u.slice();c[idx]=ns;return c.join('');}
  }
  return null;
}
// Content key: what the child actually has to solve. Shuffled option order is the same exercise.
function ckey(e){
  const t=e.w?e.w.word:e.s?e.s.text:`${e.l||''}/${e.tv||e.v||e.ans||e.base||''}${e.odd||''}`;
  let c=e.type==='sameDiff'?[e.a,e.b]:(e.tiles||e.opts||e.cards||(e.items&&e.items.map(i=>i.word))||[]);
  return [e.type,e.mode||'',t,e.k??'',[...c].sort().join(',')].join('|');
}
function hkey(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
function makePool(seed,n,gen){const r=rng(seed),pool=[],keys=new Set();let guard=0;while(pool.length<n&&guard++<n*120){const e=gen(r);if(!e)continue;const ck=ckey(e);if(!keys.has(ck)){keys.add(ck);e.key=ck;e.id=hkey(ck);pool.push(e);}}return shuffle(r,pool);}
const POOL_SIZE=3200;
const V4=['k','p','e','n'];
function exHearPick(r,l){const tv=pick(r,['k','p','e']);const av=tv==='e'?pick(r,['k','p']):tv;const o=shuffle(r,[av,'e','n']);return{type:'hearPick',key:'hp'+l+tv+o.join(''),l,ans:tv==='e'?'e':av,opts:o};}
function exSameDiff(r,l){const a=pick(r,['k','p','e']),b=pick(r,['k','p','e']);return{type:'sameDiff',key:'sd'+l+a+b,l,a,b};}
function exVowelName(r,l){const v=pick(r,V4);const o=shuffle(r,V4);return{type:'vowelName',key:'vn'+l+v+o.join(''),l,v,opts:o};}
function exMatchPic(r,list){const w=pick(r,list);const others=shuffle(r,list.filter(x=>x.pic!==w.pic)).slice(0,2);const o=shuffle(r,[w.pic,...others.map(x=>x.pic)]);return{type:'matchPic',key:'mp'+w.word+o.join(''),w,opts:o};}
function exPickWord(r,list,mode){const w=pick(r,list);const set=new Set([w.word]);for(let i=0;i<10&&set.size<3;i++){const v=variant(w,r);if(v)set.add(v);}if(set.size<3)return null;const o=shuffle(r,[...set]);return{type:'pickWord',mode,key:'pw'+mode+w.word+o.join(''),w,opts:o};}

/* ===================== Sound & speech ===================== */
/* ===================== Speech =====================
   One entry point for everything the app says. Two kinds of speech:
   - UI speech (instructions, praise, encouragement): text the child does not have to read.
   - Educational speech (target words, syllables, sentences, vowel names): what the child learns to read.
   Providers: "server" = the app's own /api/tts endpoint (hosted version, real TTS provider behind it),
              "device" = the browser's built-in voice (offline / no backend).
   Educational items are played from adult-approved audio only. If an item has no approved audio,
   the adult setting decides: use the device voice (marked as unverified in the adult area) or stay silent. */
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^(he|iw)/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
const STYLE_DEVICE_RATE={word:.75,instruction:.9,praise:1,correction:.85,encourage:.9,intro:.95};
const EDU_KINDS=['word','syllable','sentence','term'];
const kindOf=t=>/\s/.test(t.trim())?'sentence':'word';
// Privacy: the child's name is never sent to the speech provider (it is only spoken by the device voice).
function redactName(t){
  const n=((typeof P==='function'&&P()&&P().name)||(typeof draft!=='undefined'&&draft&&draft.name)||'').trim();
  if(!n||!t.includes(n))return t;
  return t.split(n).join('').replace(/\s+([,!?.:])/g,'$1').replace(/^[\s,]+/,'').replace(/,\s*([!?.])/g,'$1').replace(/\s{2,}/g,' ').trim();
}
const cleanSpeech=t=>String(t).replace(/\p{Extended_Pictographic}/gu,'').replace(/[\uFE0F\u200D]/g,'').replace(/\s+/g,' ').trim();
const Speech=(()=>{
  let mode='device',cfgVersion='0',approvedVersion='0',approved=new Set(),ready=false;
  const audioCache=new Map();let seq=0,current=null;
  const stats={requests:0,cacheHits:0,failures:0,lastError:null};
  const deviceOK=()=>'speechSynthesis' in window;
  const eduKey=(text,kind)=>kind+'|'+text.normalize('NFC');
  async function fetchT(url,ms){const ac=new AbortController();const t=window.setTimeout(()=>ac.abort(),ms);try{return await fetch(url,{signal:ac.signal});}finally{window.clearTimeout(t);}}
  async function init(){
    if(!IS_PROD)return;
    try{const r=await fetchT('/api/tts/health',4000);if(!r.ok)return;const j=await r.json();if(!j.enabled)return;
      mode='server';cfgVersion=String(j.configVersion||'0');approvedVersion=String(j.approvedVersion||'0');
      const a=await fetchT('/api/tts/approved?v='+encodeURIComponent(j.approvedVersion||'0'),6000);
      if(a.ok){const k=await a.json();approved=new Set(k.items||[]);}
    }catch(e){stats.lastError='init: '+(e.name||e);}
    finally{ready=true;}
  }
  const eduFallback=()=>DB.eduFallback||'device';
  function canPlayEdu(text,kind){
    if(!DB.sound)return false;
    if(mode==='server'&&approved.has(eduKey(text,kind)))return true;
    return eduFallback()==='device'&&deviceOK()&&(!!voice||speechSynthesis.getVoices().length===0);
  }
  function stop(){seq++;if(current){try{current.pause();}catch(e){}current=null;}if(deviceOK())try{speechSynthesis.cancel();}catch(e){}}
  function deviceSay(text,rate,onstart){
    return new Promise(res=>{
      if(!deviceOK()){res(false);return;}
      try{const u=new SpeechSynthesisUtterance(text);u.lang='he-IL';if(voice)u.voice=voice;u.rate=rate*(DB.rate||1);u.pitch=1.1;
        let done=false;const fin=ok=>{if(!done){done=true;res(ok);}};
        u.onstart=()=>onstart&&onstart();u.onend=()=>fin(true);u.onerror=()=>fin(false);
        speechSynthesis.speak(u);window.setTimeout(()=>fin(false),Math.max(4000,text.length*350));}catch(e){res(false);}
    });
  }
  async function getAudioURL(url){
    if(audioCache.has(url)){stats.cacheHits++;return audioCache.get(url);}
    stats.requests++;
    const r=await fetchT(url,7000);
    if(!r.ok){let reason='http '+r.status;try{reason=(await r.json()).error||reason;}catch(e){}throw new Error(reason);}
    const b=await r.blob();if(!b.size)throw new Error('empty audio');
    const u=URL.createObjectURL(b);audioCache.set(url,u);return u;
  }
  function playURL(u,onstart,my){
    return new Promise(res=>{
      if(my!==seq){res(true);return;}
      const a=new Audio(u);current=a;a.playbackRate=DB.rate||1;
      let done=false;const fin=ok=>{if(!done){done=true;if(current===a)current=null;res(ok);}};
      a.onplaying=()=>onstart&&onstart();a.onended=()=>fin(true);a.onerror=()=>fin(false);
      a.onloadedmetadata=()=>window.setTimeout(()=>fin(true),(a.duration||10)*1000/(a.playbackRate||1)+2500);
      window.setTimeout(()=>{if(!a.duration)fin(false);},8000);
      a.play().catch(()=>fin(false));
    });
  }
  // item: {text, kind:'ui'|edu kind, style, onstart}
  async function playOne(it,my){
    const text=cleanSpeech(it.text);if(!text||my!==seq)return;
    const edu=EDU_KINDS.includes(it.kind);
    const style=edu?'word':(it.style||'instruction');
    if(mode==='server'){
      const sendable=edu?text:redactName(text);
      if(edu&&!approved.has(eduKey(text,it.kind))){
        if(eduFallback()==='device'){await deviceSay(it.kind==='syllable'?sylSound(text):text,STYLE_DEVICE_RATE.word,it.onstart);}
        else noteMissing(it.kind);
        return;
      }
      const url=edu?`/api/tts?kind=${it.kind}&av=${approvedVersion}&text=${encodeURIComponent(text)}`
                   :`/api/tts?kind=ui&style=${style}&cv=${cfgVersion}&text=${encodeURIComponent(sendable)}`;
      try{const u=await getAudioURL(url);if(my!==seq)return;const ok=await playURL(u,it.onstart,my);if(ok)return;throw new Error('playback failed');}
      catch(e){
        stats.failures++;stats.lastError=String(e.message||e);
        if(my!==seq)return;
        // UI speech may fall back to the device voice; educational speech only if the adult allowed it
        if(!edu||eduFallback()==='device'){await deviceSay(edu&&it.kind==='syllable'?sylSound(text):text,STYLE_DEVICE_RATE[style]||.9,it.onstart);}
        else noteMissing(it.kind);
      }
      return;
    }
    // device mode
    if(edu&&eduFallback()==='none'){noteMissing(it.kind);return;}
    await deviceSay(edu&&it.kind==='syllable'?sylSound(text):text,STYLE_DEVICE_RATE[style]||.9,it.onstart);
  }
  let missingShown=0;
  function noteMissing(kind){if(Date.now()-missingShown<20000)return;missingShown=Date.now();const b=document.getElementById('bubble');if(b)b.textContent=`🔇 ${{syllable:'לצליל הזה',sentence:'למשפט הזה',term:'לשם הניקוד הזה'}[kind]||'למילה הזו'} עוד אין קול. אפשר להמשיך 🙂`;}
  async function play(items){
    stop();const my=seq;if(!DB.sound)return;
    for(const it of items){if(my!==seq)return;await playOne(it,my);}
  }
  return{init,play,stop,canPlayEdu,stats,get mode(){return mode;},get approvedCount(){return approved.size;},get ready(){return ready;}};
})();

let actx=null;

// Drag & tap. Move/up are tracked on window, so a drag always ends cleanly even if the
// card is re-rendered or the browser drops pointer capture mid-drag.
function makeDraggable(node,{onTap,onDrop}){
  node.addEventListener('pointerdown',e=>{
    if(node.classList.contains('used')||(e.pointerType==='mouse'&&e.button!==0))return;
    e.preventDefault();
    document.querySelectorAll('.ghost').forEach(x=>x.remove());
    const st={id:e.pointerId,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,drag:false,ghost:null,over:null};
    const clearOver=()=>{if(st.over){st.over.classList.remove('over');st.over=null;}};
    const zoneAt=(x,y)=>{const t=document.elementFromPoint(x,y);return t&&t.closest('.slot,.bin,.tray');};
    const move=ev=>{
      if(ev.pointerId!==st.id)return;
      st.lx=ev.clientX;st.ly=ev.clientY;
      if(!st.drag&&Math.hypot(st.lx-st.sx,st.ly-st.sy)>8){
        st.drag=true;st.ghost=node.cloneNode(true);st.ghost.classList.remove('lifting','sel','shake');st.ghost.classList.add('ghost');
        document.body.appendChild(st.ghost);node.classList.add('lifting');
      }
      if(st.drag){
        ev.preventDefault();
        st.ghost.style.left=st.lx+'px';st.ghost.style.top=st.ly+'px';
        const z=zoneAt(st.lx,st.ly);const hit=z&&!z.classList.contains('tray')?z:null;
        if(hit!==st.over){clearOver();if(hit){hit.classList.add('over');st.over=hit;}}
      }
    };
    const finish=(ev,cancelled)=>{
      if(ev.pointerId!==st.id)return;
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);
      if(st.ghost)st.ghost.remove();node.classList.remove('lifting');clearOver();
      if(st.drag){const x=cancelled?st.lx:ev.clientX,y=cancelled?st.ly:ev.clientY;onDrop&&onDrop(document.elementFromPoint(x,y));}
      else if(!cancelled)onTap&&onTap();
    };
    const up=ev=>finish(ev,false),cancel=ev=>finish(ev,true);
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',cancel);
  });

R.build=(ex,ctx)=>{
  const n=ex.answer.length,slots=Array(n).fill(null);let finished=false;
  const lockTi=ex.mode==='sentence'?ex.tiles.indexOf(ex.answer[0]):-1;if(lockTi>=0)slots[0]=lockTi;
  const hear=ex.hear&&canHearEdu(ex.w.word,'word');
  let txt;
  if(ex.mode==='sentence')txt=`${g('סדר','סדרי')} את המילים למשפט. המילה הראשונה כבר במקום`;
  else if(ex.mode==='scramble')txt=`המילה התבלבלה! ${g('סדר','סדרי')} את הצלילים`;
  else if(ex.mode==='letters')txt=`${g('הרכב','הרכיבי')} את המילה מהאותיות`;
  else if(hear)txt=`${g('הקשב','הקשיבי')} ו${g('בנה','בני')} את המילה ששמעת`;
  else txt=`${g('בנה','בני')} את המילה של התמונה`;
  stage.append(header(txt,null,hear?()=>speakEdu(ex.w.word,'word'):null));
  if(hear)later(()=>speakEdu(ex.w.word,'word'),2000);
  const picBox=el(`<div class="pic" style="min-height:20px"></div>`);
  if(ex.showPic||(ex.mode==='hear'&&!hear))picBox.textContent=ex.w.pic;
  stage.append(picBox);
  const slotRow=el(`<div class="slots"></div>`),tray=el(`<div class="tray"></div>`);
  stage.append(slotRow,tray);
  if(ex.hint&&!picBox.textContent){const hb=el(`<div class="row"><button class="btn ghostb small">💡 רמז</button></div>`);hb.querySelector('button').onclick=()=>{picBox.textContent=ex.w.pic;picBox.classList.add('pop');hb.remove();};stage.append(hb);}
  const where=ti=>slots.indexOf(ti);
  function place(ti,si){if(finished||ti===lockTi||(lockTi>=0&&si===0))return;const cur=where(ti);if(cur>=0)slots[cur]=null;slots[si]=ti;sfx('tap');draw();check();}
  function unplace(ti){if(ti===lockTi)return;const cur=where(ti);if(cur>=0){slots[cur]=null;sfx('tap');draw();}}
  function draw(){
    slotRow.innerHTML='';tray.innerHTML='';
    slots.forEach((ti,si)=>{const s=el(`<div class="slot" data-i="${si}"></div>`);if(ti!==null){const c=el(`<div class="card tile${ti===lockTi?' locked':''}" role="button" tabindex="0">${ex.tiles[ti]}</div>`);if(ti!==lockTi)makeDraggable(c,{onTap:()=>unplace(ti),onDrop:t=>{const z=t&&t.closest('.slot');if(z)place(ti,+z.dataset.i);else unplace(ti);}});s.append(c);}slotRow.append(s);});
    ex.tiles.forEach((tx,ti)=>{const c=el(`<div class="card tile${where(ti)>=0?' used':''}" role="button" tabindex="0">${tx}</div>`);makeDraggable(c,{onTap:()=>{if(finished)return;speakEdu(tx,ex.mode==='sentence'?'word':'syllable');const e=slots.indexOf(null);if(e>=0)place(ti,e);},onDrop:t=>{const z=t&&t.closest('.slot');if(z)place(ti,+z.dataset.i);}});tray.append(c);});
  }
  function check(){
    if(slots.includes(null))return;
    const vals=slots.map(i=>ex.tiles[i]);
    if(vals.join('')===ex.answer.join('')){finished=true;[...slotRow.querySelectorAll('.card')].forEach(c=>c.classList.add('ok'));picBox.textContent=ex.w.pic;ctx.win(null,ex.w);return;}
    const cards=[...slotRow.querySelectorAll('.card')];
    vals.forEach((v,k)=>{if(v!==ex.answer[k])cards[k].classList.add('bad','shake');});
    if(ctx.miss()){finished=true;return;}
    later(()=>{vals.forEach((v,k)=>{if(v!==ex.answer[k])slots[k]=null;});draw();},750);
  }
  draw();
};

/* ===================== Read-aloud step ===================== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const micOn=()=>!!SR&&(DB.mic??!IS_PROD);
function readAloud(w,done){
  clearStage();
  say(`עכשיו ${g('קרא','קראי')} את המילה בקול רם!`);
  stage.append(el(`<div class="pic pop">${w.pic}</div>`));
  stage.append(el(`<div class="row" style="margin:14px 0"><div class="card target${w.word.includes(' ')?' sent':''}" style="padding:0 30px;${w.word.includes(' ')?'':'font-size:clamp(56px,15vw,96px)'}">${w.word}</div></div>`));
  const row=el(`<div class="row"></div>`);stage.append(row);
  const listen=el(`<button class="btn ghostb">🔊 לשמוע</button>`);listen.onclick=()=>speakEdu(w.word);
  const self=el(`<button class="btn green">✓ ${g('קראתי','קראתי')} בקול</button>`);
  let finished=false;const finish=bonus=>{if(finished)return;finished=true;if(bonus){P().stars++;save();setBuddy();sfx('win');confetti();say(`${rnd(PRAISE())} קיבלת כוכב בונוס ⭐`);}later(done,bonus?1400:300);};
  self.onclick=()=>finish(false);
  if(micOn()){
    const mic=el(`<button class="btn">🎤 ${g('אני קורא','אני קוראת')}</button>`);
    mic.onclick=()=>{
      try{
        const rec=new SR();rec.lang='he-IL';rec.maxAlternatives=5;rec.interimResults=false;
        mic.disabled=true;mic.textContent='👂 מקשיב...';
        rec.onresult=e=>{const target=strip(w.word);const alts=[...e.results[0]].map(a=>strip(a.transcript).replace(/[^\u05D0-\u05EA]/g,''));if(alts.some(a=>a.includes(target)||(a.length>1&&target.includes(a)))||matchRatio(w.word,[...e.results[0]].map(a=>a.transcript)).ratio>=.7)finish(true);else{say(`שמעתי משהו אחר. ${g('נסה','נסי')} שוב, לאט לאט 🙂`,null,'encourage');}};
        rec.onerror=()=>say(`לא הצלחתי לשמוע. ${g('לחץ','לחצי')} על "קראתי בקול" אחרי שקראת 🙂`);
        rec.onend=()=>{mic.disabled=false;mic.textContent=`🎤 ${g('אני קורא','אני קוראת')}`;};
        rec.start();
      }catch(e){say(`${g('לחץ','לחצי')} על "קראתי בקול" אחרי שקראת 🙂`);}
    };
    row.append(mic);
  }
  row.append(listen,self);
}

function runEx(ex,opts,cb){
  clearStage();stage.classList.toggle('small',!!ex.small);
  if(opts.progress)stage.append(opts.progress);
  let first=true,closed=false;
  const ctx={
    miss(){if(closed)return true;first=false;sfx('no');if(opts.placement){closed=true;say('לא נורא, ממשיכים! 🙂',null,'correction');later(()=>cb(false),1100);return true;}say(rnd(TRY()),null,'encourage');return false;},
    win(extra,w){if(closed)return;closed=true;sfx('yes');if(first&&!opts.placement){P().stars++;save();setBuddy();checkSticker();}
      const msg=rnd(PRAISE())+(extra?' '+extra:'');say(msg,null,'praise');if(first)confetti();
      if(!opts.placement&&w&&opts.read&&(ex.type==='build'||Math.random()<.4))later(()=>readAloud(w,()=>cb(first)),1300);
      else later(()=>cb(first),1400);}
  };
  R[ex.type](ex,ctx);
}
function checkSticker(){const p=P();const have=Math.floor(p.stars/10);if(have>(p.stickers||0)){p.stickers=have;save();later(()=>{sfx('win');say(`מדבקה חדשה לאוסף! ${STICKERS[(have-1)%STICKERS.length]}`);},1500);}}

const PLACE_OK={orange:e=>['tapAll','vowelName','hearPick'].includes(e.type),blue:e=>['sort','build','matchPic'].includes(e.type),green:e=>['build','pickWord'].includes(e.type),yellow:e=>e.type==='build'};
function dots(n,i){const d=el(`<div class="progress"></div>`);for(let k=0;k<n;k++)d.append(el(`<i class="${k<i?'done':k===i?'now':''}"></i>`));return d;}
function runPlacement(){
  // adaptive: start at blue, 2 questions per level (3 if split), move up/down; at most 10 questions
  const MAX=10;let q=0,cur=1,asked=0,right=0;const passed=new Set(),failed=new Set(),used=new Set();
  const finish=()=>{
    let lvl;
    if(passed.size)lvl=Math.min(3,Math.max(...passed)+1);
    else lvl=failed.size?Math.min(...failed):cur;
    const grp=ORDER[lvl];const p=P();p.group=grp;p.hist[grp]=[];p.placedAt=Date.now();save();screenPlaced(grp);
  };
  const next=()=>{
    if(q>=MAX)return finish();
    const grp=ORDER[cur];const cand=POOLS[grp].filter(e=>PLACE_OK[grp](e)&&!used.has(e));
    const ex=cand[Math.floor(Math.random()*cand.length)];used.add(ex);
    runEx(ex,{placement:true,progress:dots(MAX,q)},ok=>{
      q++;asked++;if(ok)right++;
      let v=null;
      if(asked===2&&right===2)v='up';else if(asked===2&&right===0)v='down';else if(asked===3)v=right>=2?'up':'here';
      if(v){
        asked=0;right=0;
        if(v==='up'){passed.add(cur);if(cur===3||failed.has(cur+1))return finish();cur++;}
        else{failed.add(cur);if(v==='here'||cur===0||passed.has(cur-1))return finish();cur--;}
      }
      next();
    });
  };
  next();
}

// Moving up is only offered after steady, error-free work: at least 40 exercises in the group
// and the last 20 all solved on the first try. An exercise solved on the first try twice is "mastered"
// and is not shown to that child again.
const LVL_DONE=40,LVL_STREAK=20,MASTER_AT=2;
function streakOf(p){const h=p.hist[p.group]||[];let n=0;for(let i=h.length-1;i>=0&&h[i];i--)n++;return n;}
function masteredCount(p,g){return Object.values((p.mastery&&p.mastery[g||p.group])||{}).filter(c=>c>=MASTER_AT).length;}
function readyToMoveUp(p){const gi=ORDER.indexOf(p.group);const done=p.done[p.group]||0;
  return gi>=0&&gi<ORDER.length-1&&done>=LVL_DONE&&streakOf(p)>=LVL_STREAK&&done-(p.declinedAt?.[p.group]??-1e9)>=10;}
function levelProgress(p){const done=p.done[p.group]||0;return Math.min(1,Math.min(done,LVL_DONE)/LVL_DONE*.3+Math.min(streakOf(p),LVL_STREAK)/LVL_STREAK*.7);}

  stage.append(st);

let sess=null;
function startSession(len=15){sess={n:0,len,good:0};nextEx();}
function nextEx(){
  const p=P();const grp=p.group;const pool=POOLS[grp];
  p.mastery=p.mastery||{};const m=p.mastery[grp]=p.mastery[grp]||{};
  let i=p.idx[grp]||0;for(let k=0;k<pool.length&&(m[pool[i%pool.length].id]||0)>=MASTER_AT;k++)i++;
  p.idx[grp]=i;const ex=pool[i%pool.length];
  runEx(ex,{read:true,progress:dots(sess.len,sess.n)},ok=>{
    if(ok)m[ex.id]=(m[ex.id]||0)+1;
    p.idx[grp]++;p.done[grp]=(p.done[grp]||0)+1;p.hist[grp]=[...(p.hist[grp]||[]),ok].slice(-30);p.total=(p.total||0)+1;if(ok)sess.good++;save();
    sess.n++;
    if(checkLevelUp())return;
    if(sess.n>=sess.len)endSession();else nextEx();
  });
}

  const p=P();if(!readyToMoveUp(p))return false;
  screenOfferMoveUp();return true;
}

function wordSpans(text){return text.split(' ').map(w=>{const m=w.match(/^(.*?)([.,!?:]*)$/);return{w:m[1],p:m[2]};});}
function sylHTML(w){const u=w.match(/[\u05D0-\u05EA][\u0591-\u05C7]*/g)||[w];return chunks(u).map((c,k)=>`<span class="sy s${k%2}">${c}</span>`).join('<span class="sydot">·</span>');}
function matchRatio(target,transcripts){
  const tw=cleanWords(strip(target));let best=-1,hits=tw.map(()=>false);
  transcripts.forEach(t=>{const aw=strip(t).replace(/[^\u05D0-\u05EA ]/g,' ').split(/\s+/).filter(Boolean);const h=tw.map(w=>aw.some(a=>a===w||a.endsWith(w)));const r=h.filter(Boolean).length/tw.length;if(r>best){best=r;hits=h;}});
  return{ratio:Math.max(0,best),hits};
}

function runStation(pid,si){

function runBook(pid,si){
  const b=stationsOf(pid)[si].book;let pg=0;
  const page=()=>{if(pg>=b.pages.length)return question(0);renderReading(b.pages[pg],{kind:'page',idx:pg,total:b.pages.length},()=>{pg++;page();});};
  const question=qi=>{
    if(qi>=b.qs.length)return completeStation(pid,si);
    const q=b.qs[qi];clearStage();
    stage.append(header(q.q,null,()=>speakUI(q.q)));
    const o=el(`<div class="opts"></div>`);let ok=false;
    shuffle(Math.random,q.opts.map((t,i)=>({t,i}))).forEach(x=>{const btn=el(`<button class="opt"><span class="heb" style="font-size:clamp(30px,8vw,46px)">${x.t}</span></button>`);
      btn.onclick=()=>{if(ok)return;speakEdu(x.t);if(x.i===q.a){ok=true;btn.classList.add('card','ok');sfx('yes');later(()=>question(qi+1),1200);}else{sfx('no');btn.classList.add('shake');later(()=>btn.classList.remove('shake'),500);say(`נסו להיזכר בסיפור 🙂`,null,'encourage');}};o.append(btn);});
    stage.append(o);
  };
  clearStage();stage.classList.remove('small');
  say(`ספר: ${strip(b.title)}. ${g('בוא','בואי')} נקרא ביחד!`,null,'intro');
  stage.append(el(`<div class="bookcover"><div class="pic">${b.cover}</div><h1 class="heb" style="line-height:1.6">${b.title}</h1><p class="muted" style="font-size:18px">${b.pages.length} עמודים ושתי שאלות בסוף</p></div>`));
  const go=el(`<div class="row"><button class="btn big green">📖 פותחים את הספר</button></div>`);go.querySelector('button').onclick=page;stage.append(go);
}

/* ===================== Speech catalog (for the adult review page) =====================
   Every educational text the app can voice, with the kind used as its key. review.html reads this
   through a same-origin frame, so the list always matches the deployed content. */
function buildSpeechCatalog(){
  const out=new Map();
  const add=(text,kind,src)=>{text=cleanSpeech(text);if(!text)return;const k=kind+'|'+text.normalize('NFC');const e=out.get(k)||{text:text.normalize('NFC'),kind,uses:0,src:new Set()};e.uses++;e.src.add(src);out.set(k,e);};
  LET.forEach(l=>['k','p','e','n'].forEach(v=>add(syl(l,v),'syllable','letters')));
  [...SIMPLE,...MEDIUM,...HARD].forEach(w=>{add(w.word,'word','words');w.units.forEach(u=>add(u,'syllable','words'));chunks(w.units).forEach(c=>add(c,'syllable','words'));});
  SORT.forEach(w=>add(w.word,'word','sort'));
  Object.values(VNAME).forEach(v=>add(v.n,'term','vowel names'));
  Object.entries(POOLS).forEach(([g,pool])=>pool.forEach(ex=>{
    if(ex.type==='build')ex.tiles.forEach(t=>add(t,ex.mode==='sentence'?'word':'syllable',g));
    if(ex.w&&ex.w.word)add(ex.w.word,kindOf(ex.w.word),g);
    if(ex.type==='hearPick')add(syl(ex.l,ex.ans),'syllable',g);
    if(ex.type==='sameDiff'){add(syl(ex.l,ex.a),'syllable',g);add(syl(ex.l,ex.b),'syllable',g);}
    if(ex.type==='sort')ex.items.forEach(i=>add(i.word,'word',g));
    if(ex.type==='missing')add(ex.s.text,'sentence',g);
  }));
  Object.values(PATHS).forEach(Q=>{
    [...Q.words,...Q.phrases,...Q.short,...Q.long].forEach(x=>wordSpans(x.text).forEach(p=>add(p.w,'word','reading path')));
    Q.books.forEach(b=>{b.pages.forEach(x=>wordSpans(x.text).forEach(p=>add(p.w,'word','books')));b.qs.forEach(q=>q.opts.forEach(o=>add(o,kindOf(o),'books')));});
  });
  SENTS.forEach(x=>add(x.text,'sentence','sentences'));
  return [...out.values()].map(e=>({text:e.text,kind:e.kind,uses:e.uses,sources:[...e.src]}));
}
